services:
  web:
    image: nginx:latest
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8000}:80"
    environment:
      - NGINX_HOST=localhost
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    volumes:
      - ./:/var/www

  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data-development:/var/lib/mysql
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/99-app-test-db.sh:ro

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=${DB_ROOT_PASSWORD}
      - PMA_PORT=3306
      - UPLOAD_LIMIT=100M
    depends_on:
      mysql:
        condition: service_started

volumes:
  mysql-data-development:
